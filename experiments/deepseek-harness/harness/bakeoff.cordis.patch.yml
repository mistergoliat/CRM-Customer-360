# SALES-AGENT-R2-A13-H0 bake-off patch layer, applied over
# @deepseek-ai/dsh-base@0.1.1-rc.2. Disables every plugin unrelated to (or
# unsafe for) a sales conversation -- coding tools, subagent delegation,
# plan mode, skills, web search, telemetry -- and adds only the four
# read-only bake-off tools plus the multi-turn runner. Row ids below were
# read directly from the installed package's own cordis.patch.yml (they
# changed across versions during this developer-preview's fast iteration --
# do not copy row ids from an older inspection without re-checking against
# the actually-installed version).

- id: system-prompt
  config:
    persona: >-
      Eres el agente de ventas de PesasChile, una tienda de equipamiento de
      musculacion y gimnasio en casa en Chile. Conversas por WhatsApp con
      clientes en espanol de Chile. Usa las herramientas disponibles para
      buscar productos, revisar el contexto o historial del cliente, y
      cotizar despacho. Nunca inventes productos, precios o disponibilidad
      que no vengan de una herramienta. Si una herramienta no esta
      disponible, dilo honestamente en vez de adivinar.
    complete: true
    includeRuntimeContext: false


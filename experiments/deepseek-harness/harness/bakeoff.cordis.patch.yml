- id: agent-default-model
  config:
    provider: deepseek-official
    model: !!js process.env.BRAIN_MODEL_NAME ?? 'deepseek-v4-flash'

- id: llm-deepseek
  config:
    apiKeyEnv: BRAIN_MODEL_API_KEY
    baseURL: !!js (process.env.BRAIN_MODEL_API_URL ?? 'https://api.deepseek.com/chat/completions').replace(/\/chat\/completions\/?$/, '')

- insert:
    - id: bakeoff-tools
      name: ./bakeoffToolsPlugin.ts
      config:
        customerIdentityLevel: !!js process.env.BAKEOFF_IDENTITY_LEVEL ?? 'LEVEL_0_ANONYMOUS'

    - id: bakeoff-runner
      name: ./bakeoffRunnerPlugin.ts
      config:
        scenarioPath: !!js process.env.BAKEOFF_SCENARIO_PATH
        scenarioId: !!js process.env.BAKEOFF_SCENARIO_ID
        outputPath: !!js process.env.BAKEOFF_OUTPUT_PATH
